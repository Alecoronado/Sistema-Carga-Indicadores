[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && python import_excel.py && uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/dashboard/stats"
restartPolicyType = "on_failure"
